# infra/argocd/applications/immich.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: immich
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: oci://ghcr.io/immich-app/immich-charts/immich
      chart: immich
      targetRevision: 0.13.2
      helm:
        valueFiles:
          - $values/media/immich/immich-values.yaml
    - repoURL: https://github.com/codexasystems/lab.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: immich
  syncPolicy:
    automated:
      prune: false
      selfHeal: false
