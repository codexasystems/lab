# infra/argocd/applications/homepage.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: homepage
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://jameswynn.github.io/helm-charts   # confirm against helm repo list
      chart: homepage
      targetRevision: 2.1.0
      helm:
        valueFiles:
          - $values/homepage/homepage-values.yaml
    - repoURL: https://github.com/codexasystems/lab.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: homepage
  syncPolicy:
    automated:
      prune: false
      selfHeal: false
