# infra/argocd/applications/plex.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: plex
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://bjw-s-labs.github.io/helm-charts
      chart: app-template
      targetRevision: 5.1.0
      helm:
        valueFiles:
          - $values/media/plex/plex-values.yaml
    - repoURL: https://github.com/codexasystems/lab.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: plex
  syncPolicy:
    automated:
      prune: false
      selfHeal: false
