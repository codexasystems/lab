# infra/argocd/applications/navidrome.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: navidrome
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://djjudas21.github.io/charts/
      chart: navidrome
      targetRevision: 6.8.5
      helm:
        valueFiles:
          - $values/media/navidrome/navidrome-values.yaml
    - repoURL: https://github.com/codexasystems/lab.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: media
  syncPolicy:
    automated:
      prune: false
      selfHeal: false

