# Shared across all Immich components
controllers:
  main:
    containers:
      main:
        image:
          tag: v3.1.0
        env:
          DB_HOSTNAME: "immich-postgres-rw"
          DB_DATABASE_NAME: "immich"
          DB_USERNAME:
            valueFrom:
              secretKeyRef:
                name: immich-postgres-app
                key: username
          DB_PASSWORD:
            valueFrom:
              secretKeyRef:
                name: immich-postgres-app
                key: password
          # REDIS_HOSTNAME left as chart default — it already templates to
          # '{{ printf "%s-valkey" .Release.Name }}', which correctly resolves
          # to immich-valkey given the release name is "immich"

immich:
  persistence:
    library:
      existingClaim: immich-library-pvc

valkey:
  enabled: true

server:
  enabled: true

machine-learning:
  enabled: true
